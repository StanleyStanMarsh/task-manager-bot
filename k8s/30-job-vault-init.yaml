apiVersion: batch/v1
kind: Job
metadata:
  name: vault-init
  namespace: task-manager-bot
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 8
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-mongo
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              for i in $(seq 1 60); do
                nc -z mongodb 27017 && exit 0
                sleep 2
              done
              exit 1
        - name: wait-vault
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              for i in $(seq 1 60); do
                nc -z vault 8200 && exit 0
                sleep 2
              done
              exit 1
      containers:
        - name: vault-init
          image: vault:1.13.3
          env:
            - name: VAULT_ADDR
              value: http://vault:8200
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vault-root
                  key: token
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongo-creds
                  key: username
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongo-creds
                  key: password
          command: ["/bin/sh", "/scripts/vault-init.sh"]
          volumeMounts:
            - name: vault-init-script
              mountPath: /scripts/vault-init.sh
              subPath: vault-init.sh
              readOnly: true
      volumes:
        - name: vault-init-script
          configMap:
            name: vault-init-script
            defaultMode: 0755
