apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: task-bot
  template:
    metadata:
      labels:
        app: task-bot
    spec:
      containers:
        - name: task-bot
          image: dwarfiksks/task-bot:latest
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: task-bot-secret