server.host=0.0.0.0
server.port=8080

# MongoDB — переопределение через переменные окружения MONGO_*
mongo.host=${MONGO_HOST:localhost}
mongo.port=${MONGO_PORT:27017}
mongo.database=${MONGO_DATABASE:taskmgr}
mongo.username=${MONGO_USERNAME:}
mongo.password=${MONGO_PASSWORD:}

# Telegram
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
telegram.bot.username=${TELEGRAM_BOT_USERNAME:}

# Первый super-admin (учётка API /promote и т.д.)
superadmin.telegramId=${SUPERADMIN_TELEGRAM_ID:0}
superadmin.username=${SUPERADMIN_USERNAME:}
superadmin.firstName=${SUPERADMIN_FIRST_NAME:}
superadmin.lastName=${SUPERADMIN_LAST_NAME:}
superadmin.password=${SUPERADMIN_PASSWORD:}
