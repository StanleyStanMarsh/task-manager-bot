- name: Provision and deploy task-manager-bot
  hosts: app
  become: true
  vars:
    app_dir: /opt/task-manager-bot
    compose_health_retries: 36
    compose_health_delay: 5
  tasks:
    - name: Install base packages
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present

    - name: Add Docker GPG key
      ansible.builtin.apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker apt repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: Install Docker + Compose plugin
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Ensure docker service is enabled and started
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Ensure app directory exists
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Ensure target directory for JAR
      ansible.builtin.file:
        path: "{{ app_dir }}/target"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Upload Dockerfile for on-VM image build
      ansible.builtin.copy:
        src: ../../Dockerfile
        dest: "{{ app_dir }}/Dockerfile"
        mode: "0644"

    - name: Upload built JAR from Jenkins workspace
      ansible.builtin.copy:
        src: ../../target/task-manager-bot-0.5-DEMO.jar
        dest: "{{ app_dir }}/target/task-manager-bot-0.5-DEMO.jar"
        mode: "0644"

    - name: Upload docker compose file
      ansible.builtin.copy:
        src: ../../docker-compose.prod.yml
        dest: "{{ app_dir }}/docker-compose.yml"
        mode: "0644"

    - name: Upload vault-init.sh (from Jenkins Secret file -> infra/ansible/files/)
      ansible.builtin.copy:
        src: files/vault-init.sh
        dest: "{{ app_dir }}/vault-init.sh"
        mode: "0755"

    - name: Upload vault_root_token.txt
      ansible.builtin.copy:
        src: files/vault_root_token.txt
        dest: "{{ app_dir }}/vault_root_token.txt"
        mode: "0600"

    - name: Write .env for docker compose
      ansible.builtin.copy:
        dest: "{{ app_dir }}/.env"
        mode: "0600"
        content: |
          VAULT_DEV_ROOT_TOKEN_ID={{ vault_dev_root_token_id }}
          MONGO_INITDB_ROOT_USERNAME={{ mongo_initdb_root_username }}
          MONGO_INITDB_ROOT_PASSWORD={{ mongo_initdb_root_password }}

    - name: Pull public images and build app image on VM, then start stack
      ansible.builtin.shell: |
        set -euo pipefail
        cd "{{ app_dir }}"
        docker compose pull vault mongo
        docker compose build --no-cache app
        docker compose up -d
      args:
        executable: /bin/bash

