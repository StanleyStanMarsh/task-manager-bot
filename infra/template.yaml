heat_template_version: 2015-10-15

description: |
  ВМ Ubuntu, Cinder-том под Mongo,
  подключение к существующим security groups.

parameters:
  image_id:
    type: string
    label: Image name or UUID
    default: "16729277-5d18-44ce-9581-1b2fd5d5659a"

  flavor_id:
    type: string
    label: Flavor name or UUID
    default: "m1.small"

  key_name:
    type: string
    label: SSH key pair name (Nova)
    default: "lozhkina"

  existing_subnet_id:
    type: string
    label: Subnet UUID (e.g. student-net)

  security_groups:
    type: comma_delimited_list
    label: Existing Nova security group names
    default: "lozhkina"

  availability_zone:
    type: string
    label: Availability zone
    default: "nova"

resources:
  mongo_volume:
    type: OS::Cinder::Volume
    deletion_policy: Delete
    properties:
      name:
        list_join:
          - "-"
          - - { get_param: "OS::stack_name" }
            - "mongo-vol"
      size: 10
      description: MongoDB data volume for task-manager-bot

  bot_server:
    type: OS::Nova::Server
    properties:
      name:
        list_join:
          - "-"
          - - "taskmgr-bot"
            - { get_param: "OS::stack_name" }
      image: { get_param: image_id }
      flavor: { get_param: flavor_id }
      key_name: { get_param: key_name }
      availability_zone: { get_param: availability_zone }
      networks:
        - subnet: { get_param: existing_subnet_id }
      security_groups: { get_param: security_groups }
      user_data_format: RAW
      user_data: |
        #cloud-config
        package_update: true
        package_upgrade: true
        apt:
          sources:
            docker-ce.list:
              source: deb [arch=amd64] https://download.docker.com/linux/ubuntu $RELEASE stable
              keyid: 9DC858229FC7DD38854AE2D88D81803C0EBFCD88
        packages:
          - sudo
          - curl
          - ca-certificates
          - gnupg
          - jq
          - xfsprogs
          - e2fsprogs
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        runcmd:
          # Docker: enable and allow ubuntu user to run without sudo
          - [ bash, -lc, "systemctl enable --now docker" ]
          - [ bash, -lc, "usermod -aG docker ubuntu || true" ]
          # Prepare app dir for Jenkins scp
          - [ bash, -lc, "mkdir -p /opt/task-manager-bot/target && chown -R ubuntu:ubuntu /opt/task-manager-bot" ]
          # Mount Cinder volume /dev/vdb to /var/lib/mongodb (format if empty)
          - |
              bash -lc '
                set -euxo pipefail
                DEV="/dev/vdb"
                MP="/var/lib/mongodb"
                # wait for device (cinder attach can be slightly delayed)
                for i in $(seq 1 60); do
                  [ -b "$DEV" ] && break || true
                  sleep 2
                done
                [ -b "$DEV" ] || { echo "Device not found: $DEV"; exit 1; }
                mkdir -p "$MP"
                if ! blkid "$DEV" >/dev/null 2>&1; then
                  mkfs.ext4 -F "$DEV"
                fi
                if ! mountpoint -q "$MP"; then
                  mount "$DEV" "$MP"
                fi
                if ! grep -q "^$DEV " /etc/fstab; then
                  echo "$DEV $MP ext4 defaults,nofail 0 2" >> /etc/fstab
                fi
              '

  mongo_attach:
    type: OS::Cinder::VolumeAttachment
    properties:
      instance_uuid: { get_resource: bot_server }
      volume_id: { get_resource: mongo_volume }
      mountpoint: /dev/vdb

outputs:
  server_private_ip:
    description: "Private IP address"
    value: { get_attr: [bot_server, first_address] }

  server_name:
    description: "Server display name"
    value: { get_attr: [bot_server, name] }

  server_id:
    description: "Nova instance UUID"
    value: { get_resource: bot_server }

  ssh_command:
    description: "SSH example (VPN or same L2 as subnet)"
    value:
      list_join:
        - ""
        - - "ssh -i ~/.ssh/"
          - { get_param: key_name }
          - ".pem ubuntu@"
          - { get_attr: [bot_server, first_address] }

  stack_name_out:
    description: "Heat stack name"
    value: { get_param: "OS::stack_name" }
